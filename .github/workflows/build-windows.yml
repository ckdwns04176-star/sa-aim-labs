name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows · PyInstaller onefile
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Syntax check (compileall)
        shell: pwsh
        run: python -m compileall -q app main.py

      - name: Build SA_Aim_Labs.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon assets/app.ico `
            --name "SA_Aim_Labs" `
            --add-data "ui;ui" `
            --add-data "assets;assets" `
            --add-data "config.json;." `
            --collect-all webview `
            main.py

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "dist/SA_Aim_Labs.exe"
          if (!(Test-Path $exe)) { throw "빌드 결과 $exe 가 없습니다" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "SA_Aim_Labs.exe · $size MB"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      # Actions에서 별도로 받을 수 있는 빌드 결과물
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA_Aim_Labs-windows
          path: dist/SA_Aim_Labs.exe
          if-no-files-found: error
          retention-days: 30

      # GitHub Release의 Assets에 실제 EXE를 첨부한다.
      # main push는 latest-build 릴리스를 생성/갱신하며 일반 최신 릴리스로 표시한다.
      - name: Attach EXE to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/SA_Aim_Labs.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          body: |
            SA AIM LABS · Windows 실행 파일 (onefile, 콘솔 없음)

            - 빌드 워크플로우: `Build Windows EXE`
            - 커밋: ${{ github.sha }}
            - 실행: `SA_Aim_Labs.exe` (Windows 10/11 · Edge WebView2 Runtime 필요)

            훈련 기록은 `%APPDATA%\SA_Aim_Labs\data.json` 에 저장됩니다.
          prerelease: false
          make_latest: true

      # 업로드 단계가 성공으로 끝나도 Assets에 EXE가 실제 있는지 한번 더 검사한다.
      - name: Verify Release contains EXE
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : 'latest-build';
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const asset = release.assets.find(item => item.name === 'SA_Aim_Labs.exe');
            if (!asset) {
              throw new Error(`Release ${tag} does not contain SA_Aim_Labs.exe`);
            }
            core.info(`Release asset verified: ${asset.name} (${asset.size} bytes)`);
